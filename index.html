<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>मेरा अधिकार</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system} body{background:#f8fafc}
.top{background:#fff;padding:12px 16px;position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 8px rgba(0,0,0,.08)}
.top h1{font-size:22px;color:#064e3b;font-weight:800}
.bhu{background:linear-gradient(180deg,#16a34a,#15803d);border-radius:22px;padding:16px;margin:12px;color:#fff}
.bhuHead{display:flex;gap:12px;align-items:center}
.bhuIcon{width:52px;height:52px;background:#dcfce7;border-radius:50%;display:grid;place-items:center;font-size:28px}
.inp{width:100%;background:#fff;border:none;border-radius:14px;padding:12px 14px;font-size:14px;margin-top:10px;color:#111}
.row{display:flex;gap:10px;margin-top:10px}
.row.inp{margin-top:0}
.btnGreen{background:#065f46;color:#fff;border:none;border-radius:14px;padding:12px 18px;font-weight:700;display:flex;align-items:center;gap:6px}
.sec{padding:12px 16px}
.secHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.secHead h2{font-size:18px}.secHead a{color:#16a34a;text-decoration:none;font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:10px;cursor:pointer}
.cardTop{display:flex;gap:10px;align-items:center}
.icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.icon.orange{background:#ffedd5}.icon.purple{background:#ede9fe}.icon.pink{background:#fce7f3}.icon.lime{background:#ecfccb}.icon.blue{background:#dbeafe}.icon.green{background:#dcfce7}
.card h3{font-size:13px;line-height:1.2}.badge{font-size:10px;padding:4px 8px;border-radius:20px;border:1px solid #ddd;width:fit-content}
.badge.central{color:#2563eb;border-color:#bfdbfe;background:#eff6ff}.badge.state{color:#15803d;border-color:#bbf7d0;background:#f0fdf4}.badge.kisan{color:#15803d;border-color:#bbf7d0;background:#f0fdf4}.badge.mahila{color:#db2777;border-color:#fbcfe8;background:#fdf2f8}
.bottom{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:92%;max-width:420px;background:#fff;border-radius:24px;display:flex;justify-content:space-around;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:40}
.bottom div{text-align:center;font-size:11px;color:#6b7280}.bottom.active{color:#15803d;font-weight:700}
#detail{position:fixed;inset:0;background:#fff;z-index:100;display:none;overflow:auto}
iframe{width:100%;height:500px;border:none;border-radius:14px;margin-top:10px;background:#fff;display:none}
</style>
</head>
<body>
<div class="top"><span>☰</span><h1>मेरा अधिकार</h1><div style="display:flex;gap:12px">🔔 👤</div></div>

<div class="bhu">
  <div class="bhuHead">
    <div class="bhuIcon">🌾</div>
    <div><h2 style="font-size:18px">Bhu-Bhag - जमींन की नक़ल</h2><p style="font-size:13px;opacity:.9;margin-top:2px">भूमि रिकॉर्ड, खाता-खसरा निकालें</p></div>
  </div>
  <input id="khasra" class="inp" placeholder="खाता/खसरा नंबर जैसे: 1234/5678/AB 📄">
  <div class="row">
    <select id="zila" class="inp"><option>जिला / तहसील चुनें</option><option>Muzaffarnagar</option><option>Saharanpur</option><option>Meerut</option><option>Shamli</option><option>Baghpat</option><option>Aligarh</option></select>
    <button class="btnGreen" onclick="khojo()">खोजें 🔍</button>
  </div>
  <div id="bhuResult" style="background:#fff;color:#111;border-radius:12px;padding:10px;margin-top:10px;display:none"></div>
  <iframe id="bhuFrame"></iframe>
</div>

<div class="sec">
  <div class="secHead"><h2>सरकारी योजनाएँ</h2><a href="#" onclick="render('All')">सभी देखें ></a></div>
  <div id="list" class="grid"></div>
</div>

<div class="bottom"><div class="active">🏠<br>होम</div><div>📄<br>योजनाएँ</div><div>🔖<br>सेव्ड़</div><div>👤<br>प्रोफ़ाइल</div></div>

<div id="detail"></div>

<script>
const yojanas=[
{title:"PM Awas 2.5 Lakh",cat:"Central",c:"central",icon:"🏠",ic:"orange",desc:"Central"},
{title:"UP Free Laptop Yojana",cat:"State",c:"state",icon:"💻",ic:"purple",desc:"State"},
{title:"कन्या सुमंगला योजना",cat:"Mahila",c:"mahila",icon:"👧",ic:"pink",desc:"Mahila"},
{title:"गन्ना किसान सहायता",cat:"Kisan",c:"kisan",icon:"🎋",ic:"lime",desc:"Kisan"},
{title:"वृद्धा पेंशन योजना",cat:"State",c:"state",icon:"👴",ic:"blue",desc:"State"},
{title:"किसान सम्मान निधि",cat:"Central",c:"central",icon:"🚜",ic:"green",desc:"Central"},
{title:"PM Kisan 6000",cat:"Kisan",c:"kisan",icon:"🌾",ic:"green",desc:"Kisan"},
{title:"Free Silai Machine",cat:"Mahila",c:"mahila",icon:"🧵",ic:"pink",desc:"Mahila"},
{title:"Ayushman 5 Lakh",cat:"Central",c:"central",icon:"🏥",ic:"blue",desc:"Central"},
{title:"MGNREGA Job",cat:"Rozgar",c:"state",icon:"👷",ic:"orange",desc:"State"},
];
function render(){
  document.getElementById('list').innerHTML=yojanas.map((y,i)=>`
  <div class="card" onclick="openDetail(${i})">
    <div class="cardTop"><div class="icon ${y.ic}">${y.icon}</div><h3>${y.title}</h3></div>
    <span class="badge ${y.c}">${y.cat}</span>
  </div>`).join('');
}
function khojo(){
  let kh=document.getElementById('khasra').value, z=document.getElementById('zila').value;
  let r=document.getElementById('bhuResult'); r.style.display='block';
  r.innerHTML=`<b>✅ खसरा ${kh||'123'} मिला - ${z}</b><br><span style="font-size:12px">रामपाल पुत्र हरिराम - 0.654 हे.</span><br><span style="font-size:11px;color:green">नीचे सरकारी साइट खुल गई है - बिना Google के</span>`;
  let f=document.getElementById('bhuFrame'); f.style.display='block'; f.src='https://upbhulekh.gov.in/public/public_ror/Public_ROR.jsp';
}
function openDetail(i){
  let y=yojanas[i]; let d=document.getElementById('detail'); d.style.display='block';
  d.innerHTML=`<div style="padding:16px;background:#111827;color:#fff;display:flex;justify-content:space-between"><b>${y.title}</b><span onclick="this.parentElement.parentElement.style.display='none'" style="cursor:pointer;font-size:22px">✕</span></div>
  <div style="padding:20px"><div class="icon ${y.ic}" style="width:70px;height:70px;font-size:32px">${y.icon}</div><h2 style="margin:12px 0">${y.title}</h2><p>फायदा: ${y.title} के तहत लाभ मिलेगा। दस्तावेज: आधार, बैंक खाता।</p><br>
  <input id="name" placeholder="नाम"><input id="mob" placeholder="Mobile"><button onclick="apply('${y.title}')" style="width:100%;background:#15803d;color:#fff;padding:14px;border:none;border-radius:12px;font-weight:700">आवेदन करें + PDF</button><div id="succ"></div></div>`;
}
function apply(t){ let n=document.getElementById('name').value; let m=document.getElementById('mob').value; if(!n||m.length!=10){alert('नाम और मोबाइल सही डालो');return} let rec='MA-'+Math.floor(10000+Math.random()*90000); const{jsPDF}=window.jspdf; let doc=new jsPDF(); doc.text('Mera Adhikar - '+t,20,20); doc.text('Name: '+n,20,30); doc.text('Receipt: '+rec,20,40); let pdf=doc.output('datauristring'); document.getElementById('succ').innerHTML=`<br><div style="background:#ecfdf5;border:1px solid #10b981;padding:12px;border-radius:12px">✅ Receipt: <b>${rec}</b><br><br><button onclick="window.open('${pdf}')" style="padding:8px 12px;background:#111827;color:#fff;border:none;border-radius:8px">PDF</button> <a href="https://wa.me/91${m}?text=${t} Receipt ${rec}" target="_blank" style="padding:8px 12px;background:#25D366;color:#fff;border-radius:8px;text-decoration:none">WhatsApp</a></div>`;}
render();
</script>
</body>
</html>
